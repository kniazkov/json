name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  style:
    name: Code style and Javadoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check formatting, code style and API documentation
        run: mvn -B -ntp validate javadoc:javadoc
      - name: Verify that violations fail the checks
        run: python3 scripts/check-style-gate.py
      - name: Ensure checks did not change tracked files
        run: git diff --exit-code
      - name: Upload style diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: style-diagnostics
          path: |
            target/checkstyle-result.xml
            target/style-gate/
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp -DargLine=-Xss256k clean verify
      - name: Check documentation links and examples
        run: python3 scripts/check-doc-examples.py
